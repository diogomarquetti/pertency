<title>Pertency Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: shell real do Pertency (sidebar navy fixa + header) com a home em duas colunas:
   pendências à esquerda, painel do perfil e atalhos à direita. Faixa de protótipo no topo. */
:root{
  /* ===== Pertency tokens (tokens.css v0.1.0) ===== */
  --blue-100:#99CEFF; --blue-500:#2E9AFF; --blue-700:#005FB8; --blue-900:#001A62; --navy-bg:#000E38;
  --bg:#FAFBFC; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#64748B; --line:#E4E9EF;
  --brand:#2E9AFF; --brand-tint:#EAF4FF; --brand-ink:#103A63;
  --r-sm:9px; --r-md:14px; --r-lg:22px; --r-full:9999px;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-logotype:'Dongle',sans-serif;
  --text-title:700 34px/1.15 var(--font-sans);
  --text-subtitle:700 24px/1.2 var(--font-sans);
  --text-highlight:700 16px/1.3 var(--font-sans);
  --text-body:400 15px/1.6 var(--font-sans);
  --text-caption:500 12.5px/1.4 var(--font-sans);
  --space-1:8px; --space-2:16px; --space-3:24px; --space-4:32px; --space-5:40px;
  --shadow-sm:0 1px 2px rgba(15,27,45,.06); --shadow-md:0 8px 24px -8px rgba(15,27,45,.16); --shadow-lg:0 24px 48px -16px rgba(15,27,45,.24);
  --ease-standard:cubic-bezier(.4,0,.2,1); --duration-base:200ms;

  /* ===== PROTÓTIPO: cores de status ainda não existem no design system ===== */
  --danger:#B42318; --danger-tint:#FEF3F2;
  --warn:#B54708;   --warn-tint:#FFFAEB; --warn-bar:#F79009;
  --ok:#067647;     --ok-tint:#ECFDF3;

  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--text-body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--navy-bg);color:#C9D6EA;display:flex;flex-direction:column;padding:var(--space-3) var(--space-2);position:sticky;top:0;height:100vh}
.logo{font-family:var(--font-logotype);font-weight:700;font-size:44px;line-height:.8;color:#fff;padding:4px 12px 0;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:var(--space-4)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);color:inherit;text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(46,154,255,.16);color:#fff}
.nav a.on svg{color:var(--brand)}
.escola{margin-top:auto;background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:14px}
.escola small{display:block;font:var(--text-caption);color:#8FA3C0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.escola b{color:#fff;font-weight:600;font-size:14px;display:block;line-height:1.35}
.escola span{font-size:12.5px;color:#8FA3C0}

.main{min-width:0;display:flex;flex-direction:column}

/* faixa do protótipo: visualmente separada do produto */
.proto{background:var(--brand-tint);border-bottom:1px dashed var(--blue-100);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.proto .tag{font:var(--text-caption);text-transform:uppercase;letter-spacing:.08em;color:var(--brand-ink);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-full);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:var(--r-full);font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand-ink);color:#fff}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand-ink);margin-left:auto}
.sw input{width:16px;height:16px;accent-color:var(--brand-ink)}

.top{display:flex;align-items:center;gap:var(--space-2);padding-block:var(--space-2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:14px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.top .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-2)}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--muted)}
.bell i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.avatar{display:flex;align-items:center;gap:10px}
.avatar .c{width:36px;height:36px;border-radius:50%;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.avatar b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.avatar span{font-size:12.5px;color:var(--muted)}

.content{padding-block:var(--space-4) var(--space-5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;margin-inline:auto}
@media (min-width:900px){.content{padding-left:var(--space-4);padding-right:var(--space-4)}}

.hello h1{font:var(--text-subtitle);margin:0;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--muted)}
.hello p b{color:var(--ink);font-weight:600}
.hello p b.late{color:var(--danger)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:var(--space-3);margin-top:var(--space-3);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.card>header{display:flex;align-items:baseline;gap:10px;padding:18px 20px 14px}
.card>header h2{font:var(--text-highlight);margin:0}
.card>header .n{font:var(--text-caption);color:var(--muted)}
.card>header .hint{margin-left:auto;font:var(--text-caption);color:var(--muted)}

/* ---------- Pendências ---------- */
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;padding:16px 20px;border-top:1px solid var(--line);align-items:start}
.ico{width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand-tint);color:var(--blue-700);display:grid;place-items:center}
.ico.danger{background:var(--danger-tint);color:var(--danger)}
.ico.warn{background:var(--warn-tint);color:var(--warn)}
.ico.muted{background:var(--bg);color:var(--muted)}
.t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.t h3{font-size:15px;font-weight:600;margin:0;line-height:1.35}
.t h3 em{font-style:normal;color:var(--blue-700)}
.pill{font:var(--text-caption);font-weight:600;padding:2px 8px;border-radius:var(--r-full);white-space:nowrap}
.pill.danger{background:var(--danger-tint);color:var(--danger)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.desc{margin:4px 0 0;color:#334155;font-size:14px;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;font:var(--text-caption);color:var(--muted)}
.meta .who b{color:var(--ink);font-weight:600}
.why{border:0;background:none;padding:0;font:var(--text-caption);color:var(--blue-700);display:inline-flex;align-items:center;gap:4px}
.why svg{width:14px;height:14px}
.rule{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:#334155}
.rule .prov{display:inline-block;margin-left:6px;font:var(--text-caption);font-weight:700;color:var(--warn);letter-spacing:.04em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background var(--duration-base) var(--ease-standard),border-color var(--duration-base) var(--ease-standard)}
.btn:hover{border-color:var(--blue-100);background:var(--brand-tint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--blue-700);border-color:var(--blue-700)}
.btn svg{width:16px;height:16px}

.empty{display:flex;gap:14px;align-items:center;padding:20px;border-top:1px solid var(--line)}
.empty .ico{background:var(--ok-tint);color:var(--ok)}
.empty b{display:block;font-weight:600}
.empty span{color:var(--muted);font-size:14px}

/* ---------- Painel lateral ---------- */
.panel-body{padding:4px 20px 20px}
.stage{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.stage:not(:last-child)::before{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:var(--line)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--blue-100);background:var(--surface);display:grid;place-items:center;font:var(--text-caption);font-weight:700;color:var(--blue-700)}
.stage h4{margin:1px 0 6px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.stage h4 span{font:var(--text-caption);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-full);padding:3px 10px;font-size:13px;background:var(--surface)}
.chip small{font:var(--text-caption);color:var(--muted)}
.chip.late{border-color:#FECDCA;background:var(--danger-tint)}
.chip.late small{color:var(--danger)}
.none{font-size:13px;color:var(--muted)}
.foot{border-top:1px solid var(--line);margin:0 -20px -20px;padding:12px 20px;font-size:13px;color:var(--muted);border-radius:0 0 var(--r-md) var(--r-md)}
.foot b{color:var(--ink);font-weight:600}

.occ{display:flex;flex-direction:column;gap:12px}
.occ .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.occ .row span{font-variant-numeric:tabular-nums;color:var(--muted)}
.occ .row span.full{color:var(--warn);font-weight:600}
.bar{grid-column:1/-1;height:6px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-full);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-full)}
.bar i.full{background:var(--warn-bar)}

.alert{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert b{font-weight:600;font-size:14px}
.alert span{font-size:13.5px;color:#334155;line-height:1.5}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 8px}

.check{display:flex;flex-direction:column}
.check .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.check .row:first-child{border-top:0}
.check .row svg{width:18px;height:18px}
.check .row .okc{color:var(--ok)}
.check .row .wc{color:var(--warn)}
.check .row span{margin-left:auto;font:var(--text-caption);color:var(--muted);text-align:right}


/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-sm);font-size:14px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard);max-width:calc(100% - 32px);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--blue-100);font-weight:600}

/* mobile */
.mtop{display:none}
@media (max-width:1080px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;background:var(--navy-bg);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .logo{font-size:36px;padding:0}
  .avatar div{display:none}
  .sw{margin-left:0}
}
@media (max-width:560px){
  .item{grid-template-columns:36px minmax(0,1fr);gap:12px}
  .ico{width:36px;height:36px}
  .item .act{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

        <div class="avatar"><span class="c" id="ini"></span><div><b id="uname"></b><span id="urole"></span></div></div>

  </div>
</div>

const ORDEM = [['admin','Administrador'],['direcao','Direção'],['secretaria','Secretaria'],['pedagogo','Pedagogo(a)'],['professor','Professor(a)']];

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
let atual = 'pedagogo';
try{ const s = localStorage.getItem('pertency-home-perfil'); if(s && P[s]) atual = s; }catch(e){}

$('nav').innerHTML = [['house','Início',1],['users','Estudantes'],['plan','Planejamentos'],['grid','Turmas'],['user','Usuários'],['sliders','Configurações']]
  .map(([k,t,on]) => `<a href="#" class="${on?'on':''}" ${on?'aria-current="page"':''} data-go="${t}">${svg(k)}${t}</a>`).join('');

$('seg').innerHTML = ORDEM.map(([k,t]) => `<button data-p="${k}" aria-pressed="false">${t}</button>`).join('');

function pend(p){
  const [ic] = ORIG[p.o];
  const cls = p.sev==='atrasada'?'danger':p.sev==='atencao'?'warn':'';
  const pill = p.sev==='atrasada'?'<span class="pill danger">Atrasada</span>':p.sev==='atencao'?'<span class="pill warn">Atenção</span>':'';
  const id = 'r'+Math.random().toString(36).slice(2,8);
  return `<li class="item">
    <div class="ico ${cls}">${svg(ic)}</div>
    <div>
      <div class="t"><h3>${p.titulo} · <em>${p.s}</em></h3>${pill}</div>
      <p class="desc">${p.d}</p>
      <div class="meta"><span>${ORIG[p.o][1]} · ${p.meta}</span><span>${p.tempo}</span>
        <button class="why" aria-expanded="false" aria-controls="${id}">${svg('info')}Por que estou vendo isto?</button></div>
      <div class="rule" id="${id}" hidden>Regra: ${p.regra}${p.prov?'<span class="prov">PROVISÓRIO · validar prazo com P.O</span>':''}</div>
    </div>
    <div class="act"><button class="btn" data-abre="${p.abre}">${p.cta}${svg('chev')}</button></div>
  </li>`;
}
function acomp(a){
  return `<li class="item">
    <div class="ico muted">${svg(ORIG[a.o][0])}</div>
    <div>
      <div class="t"><h3>${a.titulo} · <em>${a.s}</em></h3></div>
      <p class="desc">${a.d}</p>
      <div class="meta"><span class="who">Quem resolve: <b>${a.quem}</b></span></div>
    </div>
    <div class="act"><button class="btn" data-abre="${ORIG[a.o][1]} › ${a.s}">${svg('eye')}Ver</button></div>
  </li>`;
}
function painel(tipo){
  if(tipo==='fila'){
    const total = FILA.reduce((n,f)=>n+f.alunos.length,0);
    return `<section class="card"><header><h2>Fila de ingresso</h2><span class="n">${total} estudantes</span></header>
      <div class="panel-body">${FILA.map((f,i)=>`<div class="stage"><span class="dot">${i+1}</span><div>
        <h4>${f.etapa}<span>${f.alunos.length}</span></h4>
        <div class="chips">${f.alunos.length?f.alunos.map(([n,t,late])=>`<span class="chip ${late?'late':''}">${n}<small>${t}</small></span>`).join(''):'<span class="none">Ninguém nesta etapa</span>'}</div>
      </div></div>`).join('')}
      <div class="foot">Não elegível neste mês: <b>Enzo Ramos</b>, encaminhado à rede regular com apoios.</div></div></section>`;
  }
  if(tipo==='ocupacao'){
    return `<section class="card"><header><h2>Ocupação das turmas</h2><span class="n">51 de 67 vagas</span></header>
      <div class="panel-body"><div class="occ">${TURMAS.map(([n,o,c])=>{const pct=Math.round(o/c*100),full=pct>=90;
        return `<div class="row"><b style="font-weight:500">${n}</b><span class="${full?'full':''}">${o}/${c}</span><div class="bar" role="img" aria-label="${o} de ${c} vagas"><i class="${full?'full':''}" style="width:${pct}%"></i></div></div>`}).join('')}</div></div></section>`;
  }
  if(tipo==='turma'){
    const al = [
      ['João Pedro Alves','Usa comunicação alternativa por pranchas. Antecipe as mudanças de atividade com a prancha de rotina.'],
      ['Valentina Dias','Alergia a amendoim. Confira os ingredientes do lanche coletivo.'],
      ['Bernardo Lopes','Precisa de apoio para locomoção entre salas e no intervalo.'],
      ['Pedro Henrique Silva','Fica desconfortável com ruído alto. Ofereça o abafador no intervalo e na Educação Física.']
    ];
    return `<section class="card"><header><h2>Sua turma</h2><span class="n">11 estudantes</span></header>
      <div class="panel-body"><p class="sub">EF 2º Ciclo A · Tarde · Ciclo Contínuo – Multietapas</p>
      <div style="font:var(--text-caption);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 2px">Alertas para a rotina</div>
      ${al.map(([n,t])=>`<div class="alert"><b>${n}</b><span>${t}</span></div>`).join('')}
      <div class="foot">Os outros 7 estudantes não têm alertas registrados em Condição do estudante.</div></div></section>`;
  }
  if(tipo==='config'){
    const rows = [['okc','Escola','Completo'],['warn','Mantenedora','1 bloco incompleto'],['okc','Ofertas e códigos SERE','EI aguardando P.O'],['warn','Turmas','6 ativas · 3 a revisar'],['warn','Usuários','14 ativos · 1 sem escola']];
    return `<section class="card"><header><h2>Configuração da escola</h2></header>
      <div class="panel-body"><div class="check">${rows.map(([k,t,s])=>`<div class="row">${svg(k, 'i '+(k==='okc'?'okc':'wc'))}${t}<span>${s}</span></div>`).join('')}</div></div></section>`;
  }
  return '';
}

function render(){
  const p = P[atual], vazio = $('vazio').checked;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===atual));
  $('ini').textContent = p.ini; $('uname').textContent = p.nome; $('urole').textContent = p.papel;
  $('hi').textContent = `Bom dia, ${p.primeiro}`;

  const res = vazio ? [] : [...p.resolver].sort((a,b)=>SEV[a.sev]-SEV[b.sev]);
  const ac = vazio ? [] : p.acompanhar;
  const atras = res.filter(r=>r.sev==='atrasada').length;
  const data = 'Terça-feira, 27 de outubro';
  $('sum').innerHTML = res.length
    ? `${data}. Você tem <b>${res.length} ${res.length>1?'pendências':'pendência'}</b> para resolver${atras?`, <b class="late">${atras} atrasada${atras>1?'s':''}</b>`:''}.`
    : `${data}. Nada depende de você hoje.`;
  $('belldot').hidden = !res.length;

  $('n-res').textContent = res.length || '';
  $('n-ac').textContent = ac.length || '';
  $('res').innerHTML = res.length ? res.map(pend).join('') :
    `<li class="empty"><div class="ico">${svg('okc')}</div><div><b>Nenhuma pendência sua hoje</b><span>Quando algo depender de você, aparece aqui com o passo seguinte.</span></div></li>`;
  $('ac').innerHTML = ac.length ? ac.map(acomp).join('') :
    `<li class="empty"><div class="ico">${svg('okc')}</div><div><b>Nada em andamento com outras pessoas</b><span>Os processos da escola estão em dia.</span></div></li>`;

  $('side').innerHTML = p.painel.map(painel).join('');
}

let tt;
function toast(dest){
  const t = $('toast');
  t.innerHTML = `No produto, isto abre <b>${dest}</b>.`;
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 2600);
}

document.addEventListener('click', e=>{
  const seg = e.target.closest('#seg button');
  if(seg){ atual = seg.dataset.p; try{localStorage.setItem('pertency-home-perfil', atual)}catch(err){} render(); return; }
  const why = e.target.closest('.why');
  if(why){ const r = document.getElementById(why.getAttribute('aria-controls')); r.hidden = !r.hidden; why.setAttribute('aria-expanded', !r.hidden); return; }
  const ab = e.target.closest('[data-abre]');
  if(ab){ toast(ab.dataset.abre); return; }
  const nav = e.target.closest('[data-go]');
  if(nav){ e.preventDefault(); if(nav.dataset.go!=='Início') toast(nav.dataset.go); }
});
$('vazio').addEventListener('change', render);
render();
</script>
